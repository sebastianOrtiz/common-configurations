<div class="hub-layout">
  <header class="hub-header">
    <div class="header-content">
      <!-- Left: Brand -->
      <a class="hub-info" routerLink="/hub">
        <div class="hub-logo">
          <app-icon name="Globe" [size]="32" [strokeWidth]="2"></app-icon>
        </div>
        <div class="hub-text">
          <h1>Directorio Nexora</h1>
          <p>Tus portales conectados</p>
        </div>
      </a>

      <!-- Right: User menu -->
      <div class="user-menu">
        @if (isLoggedIn()) {
          <div class="user-info">
            <span class="user-name">{{ getUserDisplayName() }}</span>
            <div class="user-avatar-placeholder">{{ getUserInitial() }}</div>
          </div>
          <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
            <app-icon name="LogOut" [size]="20" [strokeWidth]="2"></app-icon>
          </button>
        } @else {
          <a class="btn-login" routerLink="/hub/login">
            <app-icon name="User" [size]="18" [strokeWidth]="2"></app-icon>
            <span class="btn-login-label">Iniciar sesión</span>
          </a>
        }
      </div>
    </div>
  </header>

  <main class="hub-main">
    <router-outlet></router-outlet>
  </main>
</div>
